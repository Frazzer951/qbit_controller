# yaml-language-server: $schema=./config_schema.json

qbit:
  url: http://{{ip/url}}:{{port}}
  username: username
  password: password

settings:
  # If true, the script won't modify QbitTorrent
  dry_run: false

  # If true, it will enable auto management for all torrents
  enable_auto_management: true
  auto_management_ignore_tags:
    - cross-seed

  # Only log changes made to torrents
  quiet: false
  share_limits_tag: z
  tracker_error_tag: issue
  share_limits_min_seeding_time_tag: MinSeedTimeNotReached
  share_limits_min_num_seeds_tag: MinSeedsNotMet
  share_limits_filter_completed: true

processes:
  # Run tag_names process
  tag_names: true
  # Run cat_move process
  cat_move: true
  # Tag torrents based on tracker URLs
  tracker_tags: true
  # Add tracker_error_tag when no tracker is working
  tracker_errors: true
  # Apply qbit_manage-style share limits
  share_limits: true

# Optional standalone check. This is not part of the normal run; invoke it with:
#   qbit_controller --orphan-check
orphan_check:
  # Local directories to scan for data not referenced by qBittorrent.
  root_dirs:
    - /path/to/torrents

  # Optional path translations when qBittorrent reports container paths but this
  # tool scans host paths.
  path_mappings:
    - qbit: /downloads
      local: /path/to/torrents

  # Protect recently modified files from being reported.
  min_age_minutes: 30

  # Simple filename/directory-name exclusions.
  exclude_names:
    - .DS_Store
    - Thumbs.db
    - "@eaDir"

  # Where to write the generated cleanup script (one `rm -rf` per orphan).
  # The script is never run automatically. Defaults to config/orphan_cleanup.sh.
  # script_path: config/orphan_cleanup.sh

trackers:
  digitalcore.club:
    tags: DigitalCore
  iptorrents|stackoverflow.tech|routing.bgp.technology|async.empirehost.me:
    tags: iptorrents
  nyaa.tracker.wf:
    tags: Nyaa
  other:
    tags: other

share_limits:
  CROSS_SEED:
    priority: 1
    min_num_seeds: 10
    include_all_tags:
      - cross-seed
    max_seeding_time: 30d
    cleanup: false
  IPT:
    priority: 2
    max_seeding_time: 30d
    min_num_seeds: 10
    include_all_tags:
      - iptorrents
    cleanup: false
  default:
    priority: 999
    max_ratio: 1
    max_seeding_time: 1d
    categories:
      - movies-complete
      - tv-complete
      - anime-complete
      - anime-movies-complete
      - manual-complete
    cleanup: true

# Optional: Add tags to torrents based on name
names:
  # name: The torrent's name with be matched against this
  #   tag: The tag(s) to add to the torrent if the name matches
  name_1:
    tags:
      - tag_a
      - tag_b
  other_name:
    tags:
      - tag_c
  "name with spaces":
    tags:
      - tag_d
      - tag_e

# Optional
cat_moves:
  group:
    new_category: group_cat
    categories:
      - cat_1
      - cat_2
    tags:
      - tag_a
      - tag_b

  finished:
    new_category: finished
    categories:
      - cat_1
      - cat_2
