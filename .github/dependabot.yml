version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - frazzer951
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - frazzer951
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - frazzer951
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
